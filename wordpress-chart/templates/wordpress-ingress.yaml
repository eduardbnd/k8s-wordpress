# Ingress resource to route external HTTP traffic to the internal WordPress service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
spec:
  rules:
    # Routing rule based on the Host header defined in values.yaml
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress-svc
                port:
                  number: 80  # Forwarding traffic to port 80 of the wordpress service